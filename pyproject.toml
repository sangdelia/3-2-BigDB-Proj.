[project]
name = "bigdb-mvp"
version = "0.1.0"
description = "Supervised bilingual harmful-language detector MVP"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx2[brotli,http2,zstd]>=2.12.0",
    "numpy>=2.4.6",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8,<2",
    "typer>=0.21,<1",
]

[project.scripts]
bigdb-mvp = "bigdb_mvp.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.38,<2",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.basedpyright]
typeCheckingMode = "all"
stubPath = "src/bigdb_mvp/data/stubs"
pythonVersion = "3.11"
pythonPlatform = "Linux"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
venvPath = "."
venv = ".venv"
reportUnusedCallResult = "warning"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"
reportUnnecessaryComparison = "none"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "FBT001", "FBT002", "FIX002", "ISC001", "TD002", "TD003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
